services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wexample\SymfonyFile\:
        resource: '../../{Repository,Service}'

    Wexample\SymfonyFile\Service\FileSystemItemScannerFactory:
        arguments:
            $roots: '%wexample_symfony_file.roots%'

    Wexample\SymfonyFile\Api\Controller\:
        resource: '../../Api/Controller/*'
        tags: ['controller.service_arguments']

    Wexample\SymfonyFile\Api\Normalizer\:
        resource: '../../Api/Normalizer/*'
        tags: ['serializer.normalizer']

    Wexample\SymfonyFile\Twig\:
        resource: '../../Twig/*'
        tags: ['twig.extension']
